# ============================================================
# CSV Data Editor — application configuration
#
# Swap auth or storage providers by changing `provider:` below.
# Each provider reads only its own settings block, so unused
# blocks can stay in the file as documentation.
# ============================================================

app:
  title: "Data Editor"
  subtitle: "sign in to edit the dataset"

# ------------------------------------------------------------
# AUTH — pick one: mock | gcloud_identity
# (register more in providers/auth/__init__.py)
# ------------------------------------------------------------
auth:
  provider: mock

  mock:
    # Dev-only users. NEVER use in production.
    users:
      admin: "admin"
      editor: "editor"

  gcloud_identity:
    # Google Cloud Identity Platform (email+password sign-in).
    # https://cloud.google.com/identity-platform/docs/use-rest-api
    # Set the API key via env var GCP_IDENTITY_API_KEY (preferred)
    # or inline here (not recommended for committed files).
    api_key_env: GCP_IDENTITY_API_KEY
    # api_key: "..."           # inline fallback (avoid committing)

# ------------------------------------------------------------
# STORAGE — pick one: local_csv | bigquery
# (register more in providers/storage/__init__.py)
# ------------------------------------------------------------
storage:
  provider: local_csv

  local_csv:
    path: sample_data/customers.csv
    id_column: null          # null → use file row order as the row id

  bigquery:
    project: my-gcp-project
    dataset: my_dataset
    table: customers
    id_column: id            # a stable unique key column is REQUIRED
    # Auth uses Application Default Credentials:
    #   gcloud auth application-default login
    # or GOOGLE_APPLICATION_CREDENTIALS=/path/to/sa.json
    location: US

# ------------------------------------------------------------
# DATASET — display name + column definitions.
# Columns/validation are placeholders until the real spec
# arrives; edit this block only, no code changes needed.
#
# Per-column rules:
#   label      display header (defaults to uppercase name)
#   type       string | number | integer | date
#   required   true/false (blank not allowed)
#   min / max  numeric bounds (number/integer)
#   max_length string length cap
#   regex      full-match regular expression
#   regex_hint message fragment shown on regex failure
#   align      left | right
#   editable   false → column is read-only in the grid
# ------------------------------------------------------------
dataset:
  display_name: customers.csv
  columns:
    - name: name
      label: NAME
      type: string
      required: true
      max_length: 80

    - name: email
      label: EMAIL
      type: string
      required: true
      regex: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
      regex_hint: "not a valid email (regex)"

    - name: city
      label: CITY
      type: string
      max_length: 60

    - name: plan
      label: PLAN
      type: string
      regex: "^(free|starter|pro|enterprise)$"
      regex_hint: "must be one of: free, starter, pro, enterprise"

    - name: seats
      label: SEATS
      type: integer
      min: 1
      max: 999
      align: right

    - name: renewal
      label: RENEWAL
      type: date
