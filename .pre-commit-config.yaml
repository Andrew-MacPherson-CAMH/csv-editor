# Setup (once per clone):
#   pip install -r requirements-dev.txt
#   pre-commit install
#
# Runs automatically on `git commit`, scoped to staged files only. To run
# everything by hand (e.g. after changing this file):
#   pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        name: ruff lint (staged Python files)
